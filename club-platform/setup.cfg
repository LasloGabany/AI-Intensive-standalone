[metadata]
name = club-platform
version = 1.0.0

[options]
packages = find:
python_requires = >=3.9
install_requires =
    asyncpg>=0.29
    sqlalchemy[asyncio]>=2.0
    alembic>=1.13
    fastapi>=0.111
    uvicorn[standard]>=0.30
    anthropic>=0.28
    httpx>=0.27
    apscheduler>=3.10
    python-dotenv>=1.0
    pydantic-settings>=2.0
    python-dateutil>=2.9

[options.extras_require]
dev =
    pytest>=8.0
    pytest-asyncio>=0.23
    pytest-cov>=5.0
